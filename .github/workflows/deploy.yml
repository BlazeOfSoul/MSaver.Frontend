name: Deploy Frontend

on:
    push:
        branches:
            - master

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Test
              run: npm test -- --watch=false

            - name: Verify layout
              run: npm run test:home-layout

            - name: Verify component style budgets
              run: npm run test:style-budgets

            - name: Build
              run: npm run build

    deploy:
        runs-on: ubuntu-latest
        needs: verify

        steps:
            - name: Deploy frontend to VPS
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  script: |
                      set -e
                      command -v flock >/dev/null
                      exec 9>/var/lock/msaver-deploy.lock
                      flock -w 900 9

                      cd /root/MSaver.Frontend
                      git fetch origin
                      git reset --hard origin/master

                      cd /root/MSaver.Deploy
                      test -r /etc/letsencrypt/live/rkolb.net/fullchain.pem
                      test -r /etc/letsencrypt/live/rkolb.net/privkey.pem
                      compose_files="-f docker-compose.yml -f docker-compose.production.yml"
                      docker compose $compose_files config --quiet

                      previous_image="$(
                        docker inspect --format '{{.Image}}' msaver-frontend 2>/dev/null || true
                      )"
                      rollback_file="$(mktemp)"
                      trap 'rm -f "$rollback_file"' EXIT
                      printf 'services:\n  frontend:\n    image: "%s"\n' \
                        "$previous_image" >"$rollback_file"

                      docker compose $compose_files build frontend

                      if docker compose $compose_files \
                        up -d --no-build --no-deps --wait --wait-timeout 180 frontend; then
                        exit 0
                      fi

                      echo "Frontend deployment failed; restoring the previous image."
                      if [ -z "$previous_image" ]; then
                        echo "Rollback is unavailable because no previous frontend image exists."
                        exit 1
                      fi

                      docker compose $compose_files -f "$rollback_file" \
                        up -d --no-build --no-deps --wait --wait-timeout 180 frontend
                      echo "Previous frontend restored."
                      exit 1
